<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./script.js" defer></script>
    <link rel="preload" href="./assets/background-start.png" as="image" fetchpriority="high">
    <link rel="stylesheet" href="./styles.css">

    <title>Document</title>
</head>

<body>
    <div class="game-container">
        <div class="game-start">
            <button id="start-game-button" class="start-game-button">НАЧАТЬ ИГРУ</button>
        </div>
        <div class="game-ends">
            <p>Thank you <br> for playing!</p>
            <button class="game-ends-button" >Play Again</button>
        </div>
        <div class="game-begin">
            <div class="interactive-container">
                <div class="play-buttons">
                    <button id="antidepressant-button" class="antidepressant-button">
                        <img src="./assets/antidepresant.png" />
                        <span>АНТИДЕПРЕСАНТЫ</span>
                    </button>
                    <button id="galoperidol-button" class="galoperidol-button">
                        <img src="./assets/galoperidol.png" />
                        <span>ГАЛОПЕРИДОЛ</span>
                    </button>
                    <button id="psyhotherapy-button" class="psyhotherapy-button">
                        <img src="./assets/psyhoterapy.png" />
                        <span>ПСИХОТЕРАПИЯ</span>
                    </button>
                </div>
                <div class="results-container">
                    <div class="healed-container">
                        <h1>ВЫЛЕЧЕНО</h1>
                        <div class="icons-healed-container">
                            <img class="healed-icon" src="./assets/success.png" alt="">
                            <img class="healed-icon" src="./assets/success.png" alt="">
                            <img class="healed-icon" src="./assets/success.png" alt="">
                            <img class="healed-icon" src="./assets/success.png" alt="">
                            <img class="healed-icon" src="./assets/success.png" alt="">
                        </div>
                    </div>
                    <div class="not-healed-container">
                        <h1>НЕ ФАРТАНУЛО</h1>
                        <div class="icons-not-healed-container">
                            <img class="not-healed-icon" src="./assets/skull.png" alt="">
                            <img class="not-healed-icon" src="./assets/skull.png" alt="">
                            <img class="not-healed-icon" src="./assets/skull.png" alt="">
                            <img class="not-healed-icon" src="./assets/skull.png" alt="">
                            <img class="not-healed-icon" src="./assets/skull.png" alt="">
                        </div>
                    </div>
                    <svg class="line" width="3" height="164" viewBox="0 0 3 164" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <line x1="1.5" y1="6.55672e-08" x2="1.49999" y2="164" stroke="#5A5A5A" stroke-width="3" />
                    </svg>
                </div>
                <button id="play-again" class="play-again-button">НАЧАТЬ ЗАНОВО</button>
            </div>
            <img id="table" class="table" src="./assets/table.png" alt="">
            <!-- FIRST PATIENT -->
            <img class="hero-visit" src="./assets/hero-1-visit.png" alt="">
            <img class="hero-cured" src="./assets/hero-1-cured.png" alt="">
            <img class="hero-not-cured" src="./assets/hero-1-fail.png" alt="">
            <img class="succes-bg" src="./assets/success-bg.gif" alt="">
            <img class="fail-bg" src="./assets/ghost.gif" alt="">
            <!-- SECOND PATIENT -->
            <img class="hero-2-visit" src="./assets/hero-2-visit.png" alt="">
            <img class="hero-not-cured-2" src="./assets/hero-2-fail.png" alt="">
            <img class="hero-2-cured" src="./assets/hero-2-cured.png" alt="">
            <div class="hearts-container">
                <img class="heart" src="./assets/heart.png" alt="">
                <img class="heart" src="./assets/heart.png" alt="">
                <img class="heart" src="./assets/heart.png" alt="">
                <img class="heart" src="./assets/heart.png" alt="">
                <img class="heart" src="./assets/heart.png" alt="">
            </div>
            <div class="message-container">
                <p id="message-p"></p>
            </div>
        </div>
    </div>

</body>

</html>
